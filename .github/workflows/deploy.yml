name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load environment
        run: cp ~/deploy-secrets/sticker-next.env .env

      - name: Apply database schema
        run: |
          set -a
          source .env
          set +a
          pnpm exec drizzle-kit push

      - name: Build
        run: pnpm build

      - name: Restart app
        run: |
          pm2 describe sticker-next > /dev/null 2>&1 \
            && pm2 restart sticker-next --update-env \
            || pm2 start pnpm --name sticker-next --cwd "$GITHUB_WORKSPACE" -- start -- -p 5173
          pm2 save
